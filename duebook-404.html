<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duebook: Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12213A; --paper:#F3EFE4; --gold:#C89B3C; --gold-bright:#E0B75B;
    --stamp-green:#2F6D4F; --slate:#5B6472; --rust:#B4472A; --white:#FFFFFF;
    --font-display:'Space Grotesk', sans-serif; --font-body:'Inter', sans-serif; --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--navy); color:var(--paper); min-height:100vh; font-family:var(--font-body);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .wrap{text-align:center; max-width:420px;}
  .torn{
    width:90px; height:90px; margin:0 auto 26px; border:2px dashed rgba(243,239,228,0.3); border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:12px;
    color:var(--rust); transform:rotate(-8deg); letter-spacing:1px;
  }
  h1{font-family:var(--font-display); font-size:26px; margin-bottom:10px;}
  p{color:#aab2c0; font-size:14.5px; margin-bottom:28px; line-height:1.6;}
  .btn{
    background:var(--gold); color:var(--navy); font-weight:600; font-size:14px; padding:12px 24px;
    border-radius:4px; border:none; text-decoration:none; display:inline-block; font-family:var(--font-body);
  }
  .code{font-family:var(--font-mono); font-size:12px; color:#6b7488; margin-top:26px;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="torn">VOID</div>
    <h1>This page tore off the ledger.</h1>
    <p>Nothing's filed under this address. It may have been moved, or the invoice you're looking for no longer exists.</p>
    <a href="#" class="btn">Back to dashboard</a>
    <div class="code">ERROR 404: NOT FOUND</div>
  </div>
</body>
</html>
